  <g><ellipse cx="810" cy="111" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="102" text-anchor="middle" class="usecase"><tspan x="810" y="102">Soumettre une demande de marketplace</tspan><tspan x="810" y="121">pour une banque</tspan></text></g>
  <g><ellipse cx="810" cy="216" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="216" text-anchor="middle" class="usecase"><tspan x="810" y="216">Payer et activer la marketplace et les services</tspan></text></g>
  <g><ellipse cx="1790" cy="121" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="1790" y="121" text-anchor="middle" class="usecase"><tspan x="1790" y="121">Vérifier l&apos;e-mail et envoyer les notifications</tspan></text></g>
  <g><ellipse cx="810" cy="381" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="372" text-anchor="middle" class="usecase"><tspan x="810" y="372">Piloter le SaaS : tableau de bord, profil,</tspan><tspan x="810" y="391">notifications, audit, logs et assistant IA</tspan></text></g>
  <g><ellipse cx="810" cy="496" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="487" text-anchor="middle" class="usecase"><tspan x="810" y="487">Traiter les adhésions des banques</tspan><tspan x="810" y="506">et les comptes concessionnaires</tspan></text></g>
  <g><ellipse cx="810" cy="611" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="602" text-anchor="middle" class="usecase"><tspan x="810" y="602">Gérer les banques, marketplaces,</tspan><tspan x="810" y="621">contenus et paramètres généraux</tspan></text></g>
  <g><ellipse cx="810" cy="726" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="717" text-anchor="middle" class="usecase"><tspan x="810" y="717">Gérer stores, modules, associations,</tspan><tspan x="810" y="736">offres, abonnements et paiements</tspan></text></g>
  <g><ellipse cx="810" cy="881" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="872" text-anchor="middle" class="usecase"><tspan x="810" y="872">Piloter l&apos;espace Banque : tableau de bord,</tspan><tspan x="810" y="891">profil, utilisateurs et notifications</tspan></text></g>
  <g><ellipse cx="810" cy="996" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="987" text-anchor="middle" class="usecase"><tspan x="810" y="987">Personnaliser les contenus, stores,</tspan><tspan x="810" y="1006">modules, produits et simulateur</tspan></text></g>
  <g><ellipse cx="810" cy="1111" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="1102" text-anchor="middle" class="usecase"><tspan x="810" y="1102">Gérer les abonnements, renouvellements</tspan><tspan x="810" y="1121">et services souscrits</tspan></text></g>
  <g><ellipse cx="810" cy="1226" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="1217" text-anchor="middle" class="usecase"><tspan x="810" y="1217">Gérer concessionnaires, partenariats,</tspan><tspan x="810" y="1236">contrats et publications</tspan></text></g>
  <g><ellipse cx="810" cy="1341" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="1332" text-anchor="middle" class="usecase"><tspan x="810" y="1332">Traiter les demandes de financement</tspan><tspan x="810" y="1351">et les documents associés</tspan></text></g>
  <g><ellipse cx="810" cy="1496" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="1487" text-anchor="middle" class="usecase"><tspan x="810" y="1487">Déposer une demande d&apos;inscription</tspan><tspan x="810" y="1506">comme Concessionnaire</tspan></text></g>
  <g><ellipse cx="810" cy="1606" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="1597" text-anchor="middle" class="usecase"><tspan x="810" y="1597">Gérer le profil, le tableau de bord</tspan><tspan x="810" y="1616">et les notifications</tspan></text></g>
  <g><ellipse cx="810" cy="1716" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="1707" text-anchor="middle" class="usecase"><tspan x="810" y="1707">Gérer les produits, les stocks</tspan><tspan x="810" y="1726">et les publications multi-banque</tspan></text></g>
  <g><ellipse cx="810" cy="1826" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="1817" text-anchor="middle" class="usecase"><tspan x="810" y="1817">Gérer demandes, invitations,</tspan><tspan x="810" y="1836">partenariats et contrats</tspan></text></g>
  <g><ellipse cx="810" cy="1936" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="1927" text-anchor="middle" class="usecase"><tspan x="810" y="1927">Suivre les dossiers de financement</tspan><tspan x="810" y="1946">associés aux produits</tspan></text></g>
  <g><ellipse cx="810" cy="2091" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="2091" text-anchor="middle" class="usecase"><tspan x="810" y="2091">S&apos;inscrire comme Client</tspan></text></g>
  <g><ellipse cx="810" cy="2201" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="2192" text-anchor="middle" class="usecase"><tspan x="810" y="2192">Créer, documenter et suivre</tspan><tspan x="810" y="2211">une demande de financement</tspan></text></g>
  <g><ellipse cx="810" cy="2346" rx="290" ry="41" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.35"/><text x="810" y="2346" text-anchor="middle" class="usecase"><tspan x="810" y="2346">Consulter la marketplace</tspan></text></g>
