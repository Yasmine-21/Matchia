<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1600" viewBox="0 0 2200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme de cas d'utilisation global de Matchia</title>
  <desc id="desc">Diagramme UML organisé par domaines métier. Les utilisateurs humains sont à l'extérieur du système Matchia. Stripe, Gemini et SMTP sont indiqués comme systèmes externes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>
  <rect width="2200" height="1600" fill="white"/>
  <text x="1100" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Diagramme de cas d'utilisation global — Matchia</text>

  <!-- System boundary -->
  <rect x="300" y="95" width="1600" height="1415" fill="white" stroke="#0f172a" stroke-width="2.6"/>
  <text x="1100" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Système Matchia</text>

  <!-- Light domain separators -->
  <rect x="350" y="165" width="1500" height="310" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="380" y="202" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#475569">Accès public et identité</text>
  <rect x="350" y="510" width="1500" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="380" y="547" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#475569">Parcours client et administration du tenant</text>
  <rect x="350" y="845" width="1500" height="610" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="380" y="882" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#475569">Pilotage SaaS, partenariats et services externes</text>

  <!-- Human actors -->
  <g transform="translate(120 220)" stroke="#0f172a" stroke-width="2.8" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="18" fill="white"/><path d="M0 18 L0 73 M-34 42 L34 42 M0 73 L-29 110 M0 73 L29 110"/>
  </g>
  <text x="120" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">Visiteur</text>
  <g transform="translate(120 625)" stroke="#0f172a" stroke-width="2.8" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="18" fill="white"/><path d="M0 18 L0 73 M-34 42 L34 42 M0 73 L-29 110 M0 73 L29 110"/>
  </g>
  <text x="120" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">Client</text>
  <g transform="translate(120 990)" stroke="#0f172a" stroke-width="2.8" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="18" fill="white"/><path d="M0 18 L0 73 M-34 42 L34 42 M0 73 L-29 110 M0 73 L29 110"/>
  </g>
  <text x="120" y="1135" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">Administrateur</text>
  <text x="120" y="1160" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">SaaS</text>

  <g transform="translate(2080 660)" stroke="#0f172a" stroke-width="2.8" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="18" fill="white"/><path d="M0 18 L0 73 M-34 42 L34 42 M0 73 L-29 110 M0 73 L29 110"/>
  </g>
  <text x="2080" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">Administrateur</text>
  <text x="2080" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">Banque</text>
  <g transform="translate(2080 1120)" stroke="#0f172a" stroke-width="2.8" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="18" fill="white"/><path d="M0 18 L0 73 M-34 42 L34 42 M0 73 L-29 110 M0 73 L29 110"/>
  </g>
  <text x="2080" y="1265" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">Administrateur</text>
  <text x="2080" y="1290" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">concessionnaire</text>

  <!-- External actors: grey and explicitly stereotyped -->
  <g transform="translate(2080 290)" stroke="#64748b" stroke-width="2.8" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="18" fill="#f1f5f9"/><path d="M0 18 L0 73 M-34 42 L34 42 M0 73 L-29 110 M0 73 L29 110"/>
  </g>
  <text x="2080" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#475569">Service e-mail SMTP</text>
  <text x="2080" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#64748b">« système externe »</text>
  <g transform="translate(2080 1380)" stroke="#64748b" stroke-width="2.8" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="18" fill="#f1f5f9"/><path d="M0 18 L0 73 M-34 42 L34 42 M0 73 L-29 110 M0 73 L29 110"/>
  </g>
  <text x="2080" y="1525" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#475569">Stripe</text>
  <text x="2080" y="1548" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#64748b">« système externe »</text>
  <g transform="translate(1975 990)" stroke="#64748b" stroke-width="2.8" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="18" fill="#f1f5f9"/><path d="M0 18 L0 73 M-34 42 L34 42 M0 73 L-29 110 M0 73 L29 110"/>
  </g>
  <text x="1975" y="1135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#475569">Gemini</text>
  <text x="1975" y="1158" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#64748b">« système externe »</text>

  <!-- Use cases: public -->
  <g><ellipse cx="650" cy="260" rx="190" ry="52" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="650" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">S'authentifier</text><text x="650" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#475569">(requis pour les espaces privés)</text></g>
  <g><ellipse cx="1180" cy="260" rx="245" ry="55" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="1180" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Consulter le marketplace</text><text x="1180" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">et les modules publics</text></g>
  <g><ellipse cx="650" cy="400" rx="190" ry="50" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="650" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Créer un compte client</text></g>
  <g><ellipse cx="1180" cy="400" rx="170" ry="50" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="1180" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Vérifier l'adresse</text><text x="1180" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">e-mail</text></g>

  <!-- Use cases: client and bank -->
  <g><ellipse cx="620" cy="650" rx="215" ry="54" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/><text x="620" y="643" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Gérer son profil et</text><text x="620" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">ses notifications</text></g>
  <g><ellipse cx="1090" cy="650" rx="215" ry="54" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/><text x="1090" y="643" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Constituer et suivre un</text><text x="1090" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">dossier de financement</text></g>
  <g><ellipse cx="1515" cy="650" rx="175" ry="50" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="1515" y="643" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Ajouter les pièces</text><text x="1515" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">justificatives</text></g>
  <g><ellipse cx="1515" cy="790" rx="205" ry="52" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/><text x="1515" y="783" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Configurer le marketplace</text><text x="1515" y="808" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">de la banque</text></g>

  <!-- Use cases: SaaS, bank and dealer -->
  <g><ellipse cx="620" cy="980" rx="215" ry="54" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/><text x="620" y="973" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Gouverner la plateforme</text><text x="620" y="998" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">(banques et marketplaces)</text></g>
  <g><ellipse cx="620" cy="1140" rx="215" ry="54" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/><text x="620" y="1133" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Gérer le catalogue global</text><text x="620" y="1158" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">(stores et modules)</text></g>
  <g><ellipse cx="620" cy="1300" rx="220" ry="54" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/><text x="620" y="1293" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Gérer les offres, abonnements</text><text x="620" y="1318" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">et paiements</text></g>
  <g><ellipse cx="1100" cy="1420" rx="200" ry="48" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/><text x="1100" y="1413" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Auditer et interroger</text><text x="1100" y="1438" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">l'assistant IA</text></g>
  <g><ellipse cx="1515" cy="960" rx="240" ry="55" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/><text x="1515" y="953" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Gérer les utilisateurs, contenus</text><text x="1515" y="978" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">et produits de la banque</text></g>
  <g><ellipse cx="1515" cy="1140" rx="235" ry="55" fill="#fefce8" stroke="#a16207" stroke-width="2.5"/><text x="1515" y="1133" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Gérer les partenariats, contrats</text><text x="1515" y="1158" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">et publications</text></g>
  <g><ellipse cx="1515" cy="1320" rx="245" ry="55" fill="#fefce8" stroke="#a16207" stroke-width="2.5"/><text x="1515" y="1313" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Gérer le catalogue, le stock et les</text><text x="1515" y="1338" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">documents concessionnaire</text></g>
  <g><ellipse cx="1100" cy="1300" rx="170" ry="48" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/><text x="1100" y="1293" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Notifier les acteurs</text><text x="1100" y="1318" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">par e-mail</text></g>

  <!-- Associations: only direct actor-to-domain links -->
  <g fill="none" stroke="#475569" stroke-width="2.2">
    <path d="M153 245 L460 260"/><path d="M153 280 L460 400"/><path d="M153 315 L935 260"/>
    <path d="M153 650 L405 650"/><path d="M153 680 L875 650"/>
    <path d="M153 1015 L405 980"/><path d="M153 1045 L405 1140"/><path d="M153 1075 L400 1300"/><path d="M153 1105 L900 1420"/>
    <path d="M2047 685 L1720 790"/><path d="M2047 715 L1750 960"/><path d="M2047 745 L1750 1140"/><path d="M2047 775 L1305 650"/>
    <path d="M2047 1145 L1750 1140"/><path d="M2047 1175 L1760 1320"/>
    <path d="M2047 315 L1350 400"/><path d="M2047 1405 L1270 1300"/><path d="M1942 1015 L1300 1420"/>
  </g>

  <!-- Include relations -->
  <g fill="none" stroke="#64748b" stroke-width="1.9" stroke-dasharray="8 6" marker-end="url(#arrow)">
    <path d="M840 400 L1010 400"/><path d="M1305 650 L1340 650"/><path d="M840 1300 L930 1300"/>
  </g>
  <text x="925" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#475569">« include »</text>
  <text x="1322" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#475569">« include »</text>
  <text x="885" y="1282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#475569">« include »</text>

  <!-- Every private function includes authentication -->
  <g fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="8 6" marker-end="url(#arrow)">
    <path d="M405 650 L365 650 L365 320 L460 300"/>
    <path d="M405 980 L380 980 L380 320 L460 298"/>
    <path d="M405 1140 L395 1140 L395 320 L460 296"/>
    <path d="M400 1300 L410 1300 L410 320 L460 294"/>
    <path d="M900 1420 L425 1420 L425 320 L460 292"/>
    <path d="M1305 650 L1305 720 L1780 720 L1780 320 L840 300"/>
    <path d="M1720 790 L1780 790 L1780 322 L840 298"/>
    <path d="M1755 960 L1780 960 L1780 324 L840 296"/>
    <path d="M1750 1140 L1780 1140 L1780 326 L840 294"/>
    <path d="M1760 1320 L1780 1320 L1780 328 L840 292"/>
  </g>
  <text x="430" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#64748b">« include »</text>
  <text x="1780" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#64748b">« include »</text>

  <!-- Compact legend -->
  <g transform="translate(365 1470)">
    <rect x="0" y="0" width="1160" height="28" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="16" y1="14" x2="70" y2="14" stroke="#475569" stroke-width="2"/><text x="83" y="19" font-family="Arial, sans-serif" font-size="14" fill="#334155">Association acteur — cas d'utilisation</text>
    <line x1="385" y1="14" x2="439" y2="14" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/><text x="452" y="19" font-family="Arial, sans-serif" font-size="14" fill="#334155">« include » : sous-fonction obligatoire</text>
    <text x="810" y="19" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Acteur gris : système externe</text>
  </g>
</svg>
