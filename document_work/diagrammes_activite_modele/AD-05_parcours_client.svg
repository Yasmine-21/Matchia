ement</tspan></text><rect x="160" y="1533" width="700" height="84" rx="22" fill="#f2f6fb" stroke="#2f75b5" stroke-width="4"/><text x="510" y="1584" text-anchor="middle" class="action"><tspan x="510" y="1584">L'Administrateur Banque examine la demande</tspan></text><polygon points="510,1630 715,1690 510,1750 305,1690" fill="#fff2cc" stroke="#2f75b5" stroke-width="4"/><text x="510" y="1683.5" text-anchor="middle" class="decision"><tspan x="510" y="1683.5">Demande</tspan><tspan x="510" y="1712.5">acceptée ?</tspan></text><rect x="860" y="1648" width="600" height="84" rx="22" fill="#fde9e7" stroke="#2f75b5" stroke-width="4"/><text x="1160" y="1685" text-anchor="middle" class="action"><tspan x="1160" y="1685">Saisir le motif et enregistrer le</tspan><tspan x="1160" y="1713">rejet</tspan></text><rect x="160" y="1778" width="700" height="84" rx="22" fill="#f2f6fb" stroke="#2f75b5" stroke-width="4"/><text x="510" y="1815" text-anchor="middle" class="action"><tspan x="510" y="1815">Enregistrer l'acceptation et réserver le</tspan><tspan x="510" y="1843">stock si nécessaire</tspan></text><rect x="160" y="1893" width="700" height="84" rx="22" fill="#f2f6fb" stroke="#2f75b5" stroke-width="4"/><text x="510" y="1944" text-anchor="middle" class="action"><tspan x="510" y="1944">Notifier le Client de la décision</tspan></text><circle cx="510" cy="2070" r="27" fill="#ffffff" stroke="#17365d" stroke-width="4"/><circle cx="510" cy="2070" r="15" fill="#17365d"/><text x="558" y="2080" class="terminal-label">Fin</text><rect x="860" y="1778" width="600" height="84" rx="22" fill="#f2f6fb" stroke="#2f75b5" stroke-width="4"/><text x="1160" y="1829" text-anchor="middle" class="action"><tspan x="1160" y="1829">Notifier le Client du rejet</tspan></text><circle cx="1160" cy="1940" r="27" fill="#ffffff" stroke="#17365d" stroke-width="4"/><circle cx="1160" cy="1940" r="15" fill="#17365d"/><text x="1208" y="1950" class="terminal-label">Fin</text></svg>