<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1650" viewBox="0 0 2300 1650" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme détaillé du cas d'utilisation S'authentifier</title>
  <desc id="desc">Quatre rôles utilisateurs à gauche, fonctions obligatoires incluses à droite et comportements conditionnels sous le cas principal.</desc>
  <defs>
    <marker id="tealArrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5.5 L0,11 z" fill="#14a9b5"/></marker>
    <marker id="amberArrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#c28b18" stroke-width="1.6"/></marker>
    <style>
      .boundary-title{font:bold 17px Arial,sans-serif;fill:#263333}.actor{font:14px Arial,sans-serif;fill:#333}
      .usecase{font:14px Arial,sans-serif;fill:#222;dominant-baseline:middle}.condition{font:italic 11px Arial,sans-serif;fill:#5f6666}
      .association{fill:none;stroke:#555;stroke-width:1.25}.include{fill:none;stroke:#14a9b5;stroke-width:1.35;stroke-dasharray:7 6}
      .extend{fill:none;stroke:#c28b18;stroke-width:1.35;stroke-dasharray:7 6}.include-label{font:12px Arial,sans-serif;fill:#39747a}
      .extend-label{font:12px Arial,sans-serif;fill:#8a6515}.legend{font:11px Arial,sans-serif;fill:#666}.caption{font:italic 16px Arial,sans-serif;fill:#444}
    </style>
  </defs>
  <rect width="2300" height="1650" fill="#fff"/>
  <rect x="300" y="60" width="1900" height="1450" fill="#fff" stroke="#4f5b5b" stroke-width="1.6"/>
  <line x1="300" y1="102" x2="2200" y2="102" stroke="#4f5b5b" stroke-width="1.2"/>
  <text x="320" y="88" class="boundary-title">Système Matchia — Authentification et contexte d'accès</text>
  <path d="M180.0,256.0 L594.7,507.4" class="association"/>
  <path d="M180.0,516.0 L527.5,538.9" class="association"/>
  <path d="M180.0,776.0 L526.9,570.4" class="association"/>
  <path d="M180.0,1036.0 L592.1,601.9" class="association"/>
  <path d="M968.0,499.0 L1475.1,247.1" class="include" marker-end="url(#tealArrow)"/><rect x="1145.1373646207535" y="366.1665314116027" width="92" height="20" rx="3" fill="#fff" opacity="0.95"/><text x="1191.1373646207535" y="380.1665314116027" text-anchor="middle" class="include-label">«include»</text>
  <path d="M1045.6,521.4 L1426.8,403.4" class="include" marker-end="url(#tealArrow)"/><rect x="1167.3470835185472" y="447.47365294203547" width="92" height="20" rx="3" fill="#fff" opacity="0.95"/><text x="1213.3470835185472" y="461.47365294203547" text-anchor="middle" class="include-label">«include»</text>
  <path d="M1076.4,543.8 L1283.4,532.9" class="include" marker-end="url(#tealArrow)"/><rect x="1121.4691270739133" y="516.9960016309998" width="92" height="20" rx="3" fill="#fff" opacity="0.95"/><text x="1167.4691270739133" y="530.9960016309998" text-anchor="middle" class="include-label">«include»</text>
  <path d="M1076.4,566.2 L1388.8,635.9" class="include" marker-end="url(#tealArrow)"/><rect x="1167.8305766624835" y="574.8791146290213" width="92" height="20" rx="3" fill="#fff" opacity="0.95"/><text x="1213.8305766624835" y="588.8791146290213" text-anchor="middle" class="include-label">«include»</text>
  <path d="M1045.6,588.6 L1470.1,788.2" class="include" marker-end="url(#tealArrow)"/><rect x="1186.4206236857485" y="654.4239273164586" width="92" height="20" rx="3" fill="#fff" opacity="0.95"/><text x="1232.4206236857485" y="668.4239273164586" text-anchor="middle" class="include-label">«include»</text>
  <path d="M968.0,611.0 L1495.4,946.8" class="include" marker-end="url(#tealArrow)"/><rect x="1154.058466067607" y="736.7604565652885" width="92" height="20" rx="3" fill="#fff" opacity="0.95"/><text x="1200.058466067607" y="750.7604565652885" text-anchor="middle" class="include-label">«include»</text>
  <path d="M639.5,1110.2 L779.8,624.8" class="extend" marker-end="url(#amberArrow)"/><rect x="658.02935802702" y="864.8984701565562" width="92" height="20" rx="3" fill="#fff" opacity="0.95"/><text x="704.02935802702" y="878.8984701565562" text-anchor="middle" class="extend-label">«extend»</text>
  <path d="M1181.0,1111.0 L847.3,624.0" class="extend" marker-end="url(#amberArrow)"/><rect x="974.8069505731493" y="855.2240964759329" width="92" height="20" rx="3" fill="#fff" opacity="0.95"/><text x="1020.8069505731493" y="869.2240964759329" text-anchor="middle" class="extend-label">«extend»</text>
  <path d="M1601.9,1138.7 L1250.0,1080.0 L1080.0,1080.0 L1080.0,710.0 L980.0,710.0 L878.1,622.2" class="extend" marker-end="url(#amberArrow)"/><rect x="1034" y="891.5" width="92" height="20" rx="3" fill="#fff" opacity="0.95"/><text x="1080" y="905.5" text-anchor="middle" class="extend-label">«extend»</text>
  <g><circle cx="110" cy="213" r="14" fill="#fff" stroke="#555" stroke-width="1.4"/><path d="M110,227 L110,265 M85,241 L135,241 M110,265 L88,292 M110,265 L132,292" fill="none" stroke="#555" stroke-width="1.4"/><text x="110" y="302" text-anchor="middle" class="actor">Administrateur SaaS</text></g>
  <g><circle cx="110" cy="473" r="14" fill="#fff" stroke="#555" stroke-width="1.4"/><path d="M110,487 L110,525 M85,501 L135,501 M110,525 L88,552 M110,525 L132,552" fill="none" stroke="#555" stroke-width="1.4"/><text x="110" y="562" text-anchor="middle" class="actor">Administrateur Banque</text></g>
  <g><circle cx="110" cy="733" r="14" fill="#fff" stroke="#555" stroke-width="1.4"/><path d="M110,747 L110,785 M85,761 L135,761 M110,785 L88,812 M110,785 L132,812" fill="none" stroke="#555" stroke-width="1.4"/><text x="110" y="822" text-anchor="middle" class="actor">Concessionnaire</text></g>
  <g><circle cx="110" cy="993" r="14" fill="#fff" stroke="#555" stroke-width="1.4"/><path d="M110,1007 L110,1045 M85,1021 L135,1021 M110,1045 L88,1072 M110,1045 L132,1072" fill="none" stroke="#555" stroke-width="1.4"/><text x="110" y="1082" text-anchor="middle" class="actor">Client</text></g>
  <g><ellipse cx="800" cy="555" rx="280" ry="70" fill="#dbe9ff" stroke="#7da3d6" stroke-width="1.45"/><text x="800" y="555" text-anchor="middle" class="usecase"><tspan x="800" y="555">S&apos;authentifier</tspan></text></g>
  <g><ellipse cx="1575" cy="197.5" rx="305" ry="52.5" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.45"/><text x="1575" y="187.5" text-anchor="middle" class="usecase"><tspan x="1575" y="187.5">Saisir l&apos;adresse e-mail</tspan><tspan x="1575" y="207.5">et le mot de passe</tspan></text></g>
  <g><ellipse cx="1575" cy="357.5" rx="305" ry="52.5" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.45"/><text x="1575" y="357.5" text-anchor="middle" class="usecase"><tspan x="1575" y="357.5">Vérifier les identifiants</tspan></text></g>
  <g><ellipse cx="1575" cy="517.5" rx="305" ry="52.5" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.45"/><text x="1575" y="517.5" text-anchor="middle" class="usecase"><tspan x="1575" y="517.5">Vérifier l&apos;état du compte</tspan></text></g>
  <g><ellipse cx="1575" cy="677.5" rx="305" ry="52.5" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.45"/><text x="1575" y="667.5" text-anchor="middle" class="usecase"><tspan x="1575" y="667.5">Charger le rôle et contrôler</tspan><tspan x="1575" y="687.5">les autorisations</tspan></text></g>
  <g><ellipse cx="1575" cy="837.5" rx="305" ry="52.5" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.45"/><text x="1575" y="837.5" text-anchor="middle" class="usecase"><tspan x="1575" y="837.5">Créer une session authentifiée</tspan></text></g>
  <g><ellipse cx="1575" cy="997.5" rx="305" ry="52.5" fill="#d7f4ef" stroke="#5d7774" stroke-width="1.45"/><text x="1575" y="987.5" text-anchor="middle" class="usecase"><tspan x="1575" y="987.5">Rediriger vers l&apos;espace</tspan><tspan x="1575" y="1007.5">correspondant au rôle</tspan></text></g>
  <g><ellipse cx="620" cy="1177.5" rx="290" ry="67.5" fill="#fff2cc" stroke="#c79a2b" stroke-width="1.45"/><text x="620" y="1167.5" text-anchor="middle" class="usecase"><tspan x="620" y="1167.5">Déterminer le contexte du tenant</tspan><tspan x="620" y="1187.5" class="condition">[Utilisateur rattaché à une banque ou à une marketplace]</tspan></text></g>
  <g><ellipse cx="1230" cy="1182.5" rx="300" ry="72.5" fill="#fff2cc" stroke="#c79a2b" stroke-width="1.45"/><text x="1230" y="1152.5" text-anchor="middle" class="usecase"><tspan x="1230" y="1152.5">Refuser l&apos;authentification</tspan><tspan x="1230" y="1172.5">et afficher un message d&apos;erreur</tspan><tspan x="1230" y="1192.5" class="condition">[Identifiants incorrects, compte inactif</tspan><tspan x="1230" y="1212.5" class="condition">ou accès hors périmètre]</tspan></text></g>
  <g><ellipse cx="1835" cy="1177.5" rx="285" ry="67.5" fill="#fff2cc" stroke="#c79a2b" stroke-width="1.45"/><text x="1835" y="1157.5" text-anchor="middle" class="usecase"><tspan x="1835" y="1157.5">Renouveler la session</tspan><tspan x="1835" y="1177.5">ou se reconnecter</tspan><tspan x="1835" y="1197.5" class="condition">[Session ou jeton d&apos;authentification expiré]</tspan></text></g>
  <g class="legend">
    <text x="1540" y="1380">Association : trait plein</text>
    <text x="1540" y="1405">«include» : sous-fonction obligatoire</text>
    <text x="1540" y="1430">«extend» : comportement conditionnel</text>
  </g>
  <text x="1150" y="1600" text-anchor="middle" class="caption">Figure 3.5 — Diagramme de cas d’utilisation détaillé de l’authentification</text>
</svg>