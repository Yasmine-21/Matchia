<svg width="620" height="180" viewBox="0 0 620 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Matchia wordmark">
  <defs>
    <linearGradient id="wordmark-blue" x1="18" y1="40" x2="450" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F58F0"/>
      <stop offset="1" stop-color="#1451E5"/>
    </linearGradient>
    <linearGradient id="wordmark-orange" x1="444" y1="40" x2="602" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF6710"/>
    </linearGradient>
  </defs>

  <rect width="620" height="180" fill="white"/>

  <text x="16" y="124"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="128"
        font-weight="800"
        letter-spacing="-5">
    <tspan fill="url(#wordmark-blue)">Match</tspan><tspan fill="url(#wordmark-orange)">ia</tspan>
  </text>
</svg>
