
sonar.projectKey=Matchia-Frontend
sonar.projectName=Matchia Frontend
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/components/ui/**
sonar.coverage.exclusions=**/components/ui/**

sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.javascript.node.maxspace=4096
sonar.javascript.node.debugMemory=true